services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vinami_acs}
      POSTGRES_USER: ${POSTGRES_USER:-vinami}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vinami}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command: ["sh", "-c", "alembic upgrade head && alembic check"]
    environment:
      VINAMI_DATABASE_URL: postgresql+psycopg://vinami:vinami@postgres:5432/vinami_acs
      VINAMI_LOG_LEVEL: INFO
      VINAMI_IDENTITY_MODE: ${VINAMI_IDENTITY_MODE:-development}
      VINAMI_ECG_ARTIFACT_ROOT: /var/lib/vinami/ecg-artifacts
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ecg-artifact-init:
    image: alpine:3.20
    command: ["sh", "-c", "chown -R 10001:10001 /artifacts && chmod 750 /artifacts"]
    user: "0:0"
    volumes:
      - ecg_artifact_data:/artifacts
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command: uvicorn apps.api.main:create_app --factory --host 0.0.0.0 --port 8000
    environment:
      VINAMI_DATABASE_URL: postgresql+psycopg://vinami:vinami@postgres:5432/vinami_acs
      VINAMI_REDIS_URL: redis://redis:6379/0
      VINAMI_LOG_LEVEL: INFO
      VINAMI_IDENTITY_MODE: ${VINAMI_IDENTITY_MODE:-development}
      VINAMI_ECG_ARTIFACT_ROOT: /var/lib/vinami/ecg-artifacts
      VINAMI_ECG_PROVIDER: mock
      VINAMI_ECG_ALLOW_MOCK_PROVIDER: "true"
    depends_on:
      ecg-artifact-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ecg_artifact_data:/var/lib/vinami/ecg-artifacts
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command: streamlit run apps/dashboard/main.py --server.address 0.0.0.0 --server.port 8501
    environment:
      VINAMI_DASHBOARD_API_BASE_URL: http://api:8000
      VINAMI_DASHBOARD_DEMO_MODE: ${VINAMI_DASHBOARD_DEMO_MODE:-false}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_PRODUCT_NAME: ${NEXT_PUBLIC_PRODUCT_NAME:-VinAMI ACS Operating System}
        NEXT_PUBLIC_ORGANIZATION_NAME: ${NEXT_PUBLIC_ORGANIZATION_NAME:-VinAMI Clinical Research}
        NEXT_PUBLIC_ENVIRONMENT: ${NEXT_PUBLIC_ENVIRONMENT:-Development}
        NEXT_PUBLIC_RESEARCH_USE: ${NEXT_PUBLIC_RESEARCH_USE:-true}
    environment:
      VINAMI_API_BASE_URL: http://api:8000
      VINAMI_WEB_IDENTITY_MODE: ${VINAMI_WEB_IDENTITY_MODE:-development}
      VINAMI_WEB_DEVELOPMENT_IDENTITY: ${VINAMI_WEB_DEVELOPMENT_IDENTITY:-physician}
      NEXT_PUBLIC_PRODUCT_NAME: ${NEXT_PUBLIC_PRODUCT_NAME:-VinAMI ACS Operating System}
      NEXT_PUBLIC_ORGANIZATION_NAME: ${NEXT_PUBLIC_ORGANIZATION_NAME:-VinAMI Clinical Research}
      NEXT_PUBLIC_ENVIRONMENT: ${NEXT_PUBLIC_ENVIRONMENT:-Development}
      NEXT_PUBLIC_RESEARCH_USE: ${NEXT_PUBLIC_RESEARCH_USE:-true}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 4s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command: python -m apps.worker.main
    environment:
      VINAMI_DATABASE_URL: postgresql+psycopg://vinami:vinami@postgres:5432/vinami_acs
      VINAMI_REDIS_URL: redis://redis:6379/0
      VINAMI_LOG_LEVEL: INFO
      VINAMI_IDENTITY_MODE: ${VINAMI_IDENTITY_MODE:-development}
      VINAMI_ECG_ARTIFACT_ROOT: /var/lib/vinami/ecg-artifacts
    depends_on:
      ecg-artifact-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ecg_artifact_data:/var/lib/vinami/ecg-artifacts

  prometheus:
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "9090:9090"

volumes:
  postgres_data:
  ecg_artifact_data:
